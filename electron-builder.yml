appId: com.courtrise.app
productName: COURT RISE
copyright: Copyright © 2026 COURT//RISE
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!**/*.{ts,tsx,map}'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - resources/**
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: CourtRise-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: COURT RISE 球场生涯
  uninstallDisplayName: COURT RISE 球场生涯
  installerLanguages: [zh_CN]
  language: '2052'
